[project]
name = "pa"
version = "0.1.0"
description = "Personal Assistant CLI toolkit"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-mock>=3.14", "pytest-asyncio>=0.24"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pa_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true
